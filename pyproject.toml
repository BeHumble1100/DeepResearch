[project]
name = "deepresearch"
version = "0.1.0"
description = "Evidence-driven multi-hop web research agent"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12,<5.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "langgraph>=1.0,<2.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "pypdf>=5.0,<6.0",
    "rank-bm25>=0.2,<1.0",
    "trafilatura>=2.0,<3.0",
    "uvicorn>=0.30,<1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
